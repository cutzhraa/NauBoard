name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Wrapper
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradle-8.5/bin/gradle assembleDebug

      # Mengubah nama app-debug.apk menjadi NauBoard-[TAG].apk (contoh: NauBoard-v1.0.0.apk)
      - name: Rename APK
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/NauBoard-${TAG_NAME}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/debug/NauBoard-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}